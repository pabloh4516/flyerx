<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flyerx — App · Comprovante de depósito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#0e0f18;font-family:"Inter",system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:48px 24px;min-height:100vh;box-sizing:border-box}
.frame-desktop{background:var(--color-bg);border:1px solid rgba(255,255,255,.08);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.phone{width:402px;height:874px;border-radius:48px;overflow:hidden;position:relative;background:#000;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1);flex-shrink:0}
.phone .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50}
.phone .sb{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:21px 34px 0;z-index:40;color:#fff;font-size:16px;font-weight:600}
.phone .sb .ic{display:flex;gap:7px;align-items:center}
.phone .screen{height:100%;overflow:hidden}
.phone .hb{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:100px;background:rgba(255,255,255,.7);z-index:60;pointer-events:none}
</style></head><body><div class="phone"><div class="notch"></div><div class="sb"><span>9:41</span><span class="ic"><svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#fff"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#fff"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#fff"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#fff"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/></svg></span></div><div class="screen">
<div style="background:var(--color-bg);height:100%;box-sizing:border-box;display:flex;flex-direction:column;color:var(--color-text);position:relative;overflow:hidden">
  <div style="position:absolute;top:40px;left:50%;transform:translateX(-50%);width:400px;height:320px;border-radius:50%;background:radial-gradient(closest-side,var(--color-accent-900) 0%,transparent 70%);opacity:.65;pointer-events:none"></div>
  <div style="flex:1;overflow:hidden;padding:96px 26px 30px;display:flex;flex-direction:column;gap:20px;position:relative;align-items:center">
    <div style="width:64px;height:64px;border-radius:50%;border:1px solid var(--color-accent);background:color-mix(in srgb,var(--color-accent) 10%,transparent);display:flex;align-items:center;justify-content:center;color:var(--color-accent-300);box-shadow:0 0 40px color-mix(in srgb,var(--color-accent) 30%,transparent)"><svg width="28" height="28" viewBox="0 0 16 16" fill="none"><path d="m3.5 8.5 3 3 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
      <span style="font-size:19px;font-weight:500">Depósito confirmado</span>
      <span style="font-size:12.5px;color:var(--color-neutral-500)">4 ago 2026 · 14:32:08 · liquidado em 3,2s</span>
    </div>
    <div style="width:100%;border:1px solid var(--color-divider);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--color-surface) 80%,transparent);padding:20px;display:flex;flex-direction:column;gap:0;box-shadow:var(--shadow-sm)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:14px">
        <span style="font-size:11px;color:var(--color-neutral-500)">Valor creditado</span>
        <span style="font-size:30px;font-weight:500;color:var(--color-accent-200);font-variant-numeric:tabular-nums">R$ 500,00</span>
      </div>
      <div style="height:1px;background:repeating-linear-gradient(to right,var(--color-neutral-700) 0 6px,transparent 6px 12px);margin:0 -20px"></div>
      <div style="display:flex;justify-content:space-between;padding:12px 0 8px"><span style="font-size:12px;color:var(--color-neutral-500)">De</span><span style="font-size:12px;text-align:right">Marina Costa<br><span style="color:var(--color-neutral-600)">Banco 341 · Itaú</span></span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0"><span style="font-size:12px;color:var(--color-neutral-500)">Para</span><span style="font-size:12px;text-align:right">Carteira Flyerx<br><span style="color:var(--color-neutral-600)">Conta 0001 · ag. 260</span></span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0"><span style="font-size:12px;color:var(--color-neutral-500)">Taxa</span><span style="font-size:12px;color:var(--color-accent-300)">Isento</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 0"><span style="font-size:12px;color:var(--color-neutral-500)">ID da transação</span><span style="font-size:11px;font-family:ui-monospace,monospace;color:var(--color-neutral-400);display:flex;align-items:center;gap:6px">E2E-a1b2c39f<svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="color:var(--color-accent-300)"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"></rect><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" stroke="currentColor" stroke-width="1.3"></path></svg></span></div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-top:auto">
      <button class="btn btn-primary btn-block" style="height:46px">Compartilhar comprovante</button>
      <button class="btn btn-ghost btn-block">Voltar ao início</button>
    </div>
  </div>
</div>
</div><div class="hb"></div></div>
</body></html>
