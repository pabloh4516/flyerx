<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flyerx — App · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#0e0f18;font-family:"Inter",system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:48px 24px;min-height:100vh;box-sizing:border-box}
.frame-desktop{background:var(--color-bg);border:1px solid rgba(255,255,255,.08);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.phone{width:402px;height:874px;border-radius:48px;overflow:hidden;position:relative;background:#000;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1);flex-shrink:0}
.phone .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50}
.phone .sb{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:21px 34px 0;z-index:40;color:#fff;font-size:16px;font-weight:600}
.phone .sb .ic{display:flex;gap:7px;align-items:center}
.phone .screen{height:100%;overflow:hidden}
.phone .hb{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:100px;background:rgba(255,255,255,.7);z-index:60;pointer-events:none}
</style></head><body><div class="phone"><div class="notch"></div><div class="sb"><span>9:41</span><span class="ic"><svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#fff"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#fff"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#fff"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#fff"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/></svg></span></div><div class="screen">
<div style="background:var(--color-bg);height:100%;box-sizing:border-box;display:flex;flex-direction:column;color:var(--color-text);position:relative;overflow:hidden">
  <div style="position:absolute;top:-180px;right:-120px;width:480px;height:480px;border-radius:50%;background:radial-gradient(closest-side,var(--color-section-glow) 0%,transparent 68%);opacity:.6;pointer-events:none"></div>
  <div style="position:absolute;bottom:-220px;left:-140px;width:460px;height:460px;border-radius:50%;background:radial-gradient(closest-side,var(--color-accent-900) 0%,transparent 70%);opacity:.7;pointer-events:none"></div>
  <div style="flex:1;padding:130px 28px 40px;display:flex;flex-direction:column;gap:30px;position:relative">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="width:52px;height:52px;border-radius:14px;border:1px solid var(--color-accent-700);background:linear-gradient(135deg,var(--color-accent-900),transparent);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;box-shadow:0 0 30px color-mix(in srgb,var(--color-accent) 25%,transparent)">f<span style="color:var(--color-accent)">x</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.15">Seu dinheiro,<br>na velocidade do PIX.</span>
        <span style="font-size:13.5px;color:var(--color-neutral-500);line-height:1.5">Carteira digital em reais com depósitos e saques instantâneos.</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:auto">
      <div style="border:1px solid transparent;border-radius:var(--radius-md);background:linear-gradient(color-mix(in srgb,var(--color-surface) 85%,transparent),color-mix(in srgb,var(--color-surface) 85%,transparent)) padding-box,linear-gradient(120deg,var(--color-accent-700),var(--color-neutral-800) 60%) border-box;padding:13px 16px;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:10.5px;color:var(--color-neutral-600);text-transform:uppercase;letter-spacing:.08em">E-mail</span>
        <span style="font-size:14.5px">marina@exemplo.com</span>
      </div>
      <button class="btn btn-primary btn-block" style="height:48px;font-size:15px">Continuar</button>
      <button class="btn btn-secondary btn-block" style="height:48px;font-size:14px;display:inline-flex;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M7 8.5a5 5 0 0 1 10 0v3c0 2-.5 4.5-1.8 6.5M9.5 19c-1-1.8-1.5-4-1.5-6.5v-1M12 8.5V13c0 1.8-.3 3.8-1 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>Entrar com biometria</button>
      <div style="display:flex;align-items:center;gap:12px;padding:4px 0"><span style="flex:1;height:1px;background:linear-gradient(to right,transparent,var(--color-divider))"></span><span style="font-size:11px;color:var(--color-neutral-600)">novo por aqui?</span><span style="flex:1;height:1px;background:linear-gradient(to left,transparent,var(--color-divider))"></span></div>
      <button class="btn btn-ghost btn-block">Abrir minha conta em minutos</button>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;color:var(--color-neutral-600)"><svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M8 1.5 13.5 4v4c0 3.2-2.3 5.6-5.5 6.5C4.8 13.6 2.5 11.2 2.5 8V4L8 1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path></svg><span>Protegido com 2FA e criptografia de ponta a ponta</span></div>
    </div>
  </div>
</div>
</div><div class="hb"></div></div>
</body></html>
